spring:
  application:
    name: Convenia API

  # ─────────────────────────────────────────────────────────────────────────────
  # DataSource — PostgreSQL
  # Variables: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
  # If no env var is set, the default value after the colon (:) is used.
  # ─────────────────────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:convenia-stagge-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ConveniaHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  # ─────────────────────────────────────────────────────────────────────────────
  # JPA / Hibernate
  # ddl-auto: validate → Hibernate checks the schema matches entities.
  # Flyway creates/alters the schema; Hibernate only reads it.
  # ─────────────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─────────────────────────────────────────────────────────────────────────────
  # Flyway — Database migrations
  # Reads SQL files from: src/main/resources/db/migration/
  # Naming convention: V{major}.{minor}.{patch}__{Description}.sql
  # ─────────────────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Thymeleaf — disabled for API-only mode
  # ─────────────────────────────────────────────────────────────────────────────
  thymeleaf:
    check-template-location: false

# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# Application-specific properties
# ─────────────────────────────────────────────────────────────────────────────
app:
  jwt:
    # Secret key for signing JWT tokens.
    # MUST be at least 256 bits (32 chars) for HMAC-SHA-256.
    # Override in production via APP_JWT_SECRET env variable.
    secret: ${APP_JWT_SECRET:convenia-secret-key-for-jwt-token-must-be-256-bits!!}
    # Token expiration in milliseconds. Default: 24 hours (86400000 ms).
    expiration: ${APP_JWT_EXPIRATION:86400000}
  cors:
    # Comma-separated list of allowed frontend origins.
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:4200}
  storage:
    endpoint-url: https://6ca64745261239d70ab98f4ac30a23f2.r2.cloudflarestorage.com
    bucket:       convenia-docs
    access-key:   0bf0bfee16a8ecbf7ce5de8b509d9b7b
    secret-key:   d14294cb5baca98010a5d3225245fb2f314b3a6a0ef69f126e4da0cf1c005cac
  documenso:
    # Documenso REST API base URL (cloud: https://app.documenso.com/api/v2).
    base-url: ${DOCUMENSO_BASE_URL:https://app.documenso.com/api/v2}
    # API token. Override in production via DOCUMENSO_TOKEN env variable.
    token: ${DOCUMENSO_TOKEN:api_xp93o1213l658pke}
    # Webhook signing secret — copy from Documenso dashboard → Webhooks → Secret.
    # Leave blank locally to skip verification. REQUIRED in production.
    webhook-secret: ${DOCUMENSO_WEBHOOK_SECRET:}
    # Optional: pre-built Documenso template secondary ID (e.g. envelope_xxxx).
    # When set, skips PDF generation and uses the template instead.
    template-id: ${DOCUMENSO_TEMPLATE_ID:envelope_yiirhezvdkxikmxd}

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO
    com.uniremington.api.convenia: INFO
