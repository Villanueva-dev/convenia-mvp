spring:
  application:
    name: Convenia API

  # ─────────────────────────────────────────────────────────────────────────────
  # External config import
  # Loads `.env` from the project root automatically in local dev.
  # `optional:` means: do not fail if the file is missing (CI/prod supply
  # the env vars directly through the environment).
  # ─────────────────────────────────────────────────────────────────────────────
  config:
    import: "optional:file:.env[.properties]"

  # ─────────────────────────────────────────────────────────────────────────────
  # DataSource — PostgreSQL
  # Variables: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
  # If no env var is set, the default value after the colon (:) is used.
  # ─────────────────────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ConveniaHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      leak-detection-threshold: 2000
      auto-commit: false
      max-lifetime: 18000000

  # ─────────────────────────────────────────────────────────────────────────────
  # JPA / Hibernate
  # ddl-auto: validate → Hibernate checks the schema matches entities.
  # Flyway creates/alters the schema; Hibernate only reads it.
  # ─────────────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─────────────────────────────────────────────────────────────────────────────
  # Flyway — Database migrations
  # Reads SQL files from: src/main/resources/db/migration/
  # Naming convention: V{major}.{minor}.{patch}__{Description}.sql
  # ─────────────────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    execute-in-transaction: false
    validate-on-migrate: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Thymeleaf — disabled for API-only mode
  # ─────────────────────────────────────────────────────────────────────────────
  thymeleaf:
    check-template-location: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Multipart uploads — per-file limit for document uploads (CV, NIT, ARL, ...).
  # Keep aligned with the client-side validation in AgreementDetail (5 MB).
  # Exceeding the limit triggers MaxUploadSizeExceededException → handled in
  # GlobalExceptionHandler as HTTP 413 Payload Too Large.
  # ─────────────────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size:    5MB
      max-request-size: 5MB

# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# Application-specific properties
# ─────────────────────────────────────────────────────────────────────────────
app:
  jwt:
    # Secret key for signing JWT tokens. MUST be at least 256 bits
    # (32 chars) for HMAC-SHA-256. No default: the app fails to start
    # if APP_JWT_SECRET is not set (fail-fast on missing secret).
    secret: ${APP_JWT_SECRET}
    # Token expiration in milliseconds. Default: 24 hours (86400000 ms).
    expiration: ${APP_JWT_EXPIRATION:86400000}
  cors:
    # Comma-separated list of allowed frontend origins.
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:4200}
  storage:
    # Cloudflare R2 (S3-compatible). All secrets must come from the environment.
    endpoint-url: ${APP_STORAGE_ENDPOINT_URL}
    bucket:       ${APP_STORAGE_BUCKET:convenia-docs}
    access-key:   ${APP_STORAGE_ACCESS_KEY}
    secret-key:   ${APP_STORAGE_SECRET_KEY}
  documenso:
    # Documenso REST API base URL (cloud: https://app.documenso.com/api/v2).
    base-url: ${DOCUMENSO_BASE_URL:https://app.documenso.com/api/v2}
    # API token. No default — must be provided via DOCUMENSO_TOKEN env variable.
    token: ${DOCUMENSO_TOKEN}
    # Webhook signing secret — copy from Documenso dashboard → Webhooks → Secret.
    # Leave blank locally to skip verification. REQUIRED in production.
    webhook-secret: ${DOCUMENSO_WEBHOOK_SECRET:}
    # Optional: pre-built Documenso template secondary ID (e.g. envelope_xxxx).
    # When set, skips PDF generation and uses the template instead.
    template-id: ${DOCUMENSO_TEMPLATE_ID:}

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO
    com.uniremington.api.convenia: INFO
